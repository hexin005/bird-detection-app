<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--ink:#191919;--paper:#f2f1ea;--red:#d3212c;--yellow:#f5c400;--grey:#6f6f68}*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9d8d0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;margin:20px auto;background:var(--paper);position:relative;overflow:hidden;padding-top:70px}
.head{background:var(--ink);color:var(--paper);padding:10px 16px 8px;position:absolute;top:0;left:0;right:0}
.head b{font-size:21px;font-weight:900;letter-spacing:6px}
.head span{font-size:8.5px;letter-spacing:2px;color:#9a9a92;display:block;margin-top:2px}
.mono{font-family:Consolas,monospace;font-weight:700}
.dock{position:absolute;bottom:0;left:0;right:0;height:48px;background:var(--ink);color:var(--paper);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px}
.dock .on{color:var(--yellow);border-bottom:2px solid var(--yellow);padding-bottom:2px}
</style></head><body><div class="phone">
<div class="head"><b>鸟情信号站</b><span>QINGHE SIGNAL SERVICE · ST.01 东区</span></div>

<div style="padding:14px 16px 6px"><b style="font-size:16px;font-weight:900;letter-spacing:2px">升降控制</b><span style="font-size:9px;color:var(--grey);margin-left:8px" class="mono">定时自动降下</span></div>
<div style="margin:0 16px;border:2px solid var(--ink);background:#fbfaf4"><div style="height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px);border-bottom:2px solid var(--ink)"></div><div style="padding:12px">
<b style="font-size:13px;font-weight:900;letter-spacing:2px">驱离方式</b>
<div style="display:flex;gap:8px;margin-top:9px"><span style="flex:1;border:2px solid var(--ink);text-align:center;padding:8px 0;font-size:11.5px;font-weight:800;display:flex;flex-direction:column;gap:1px;">▲ 声波<em style="font-style:normal;font-size:8px;letter-spacing:1px;color:var(--grey)" class="mono">ACOUSTIC 01</em></span><span style="flex:1;border:2px solid var(--ink);text-align:center;padding:8px 0;font-size:11.5px;font-weight:800;display:flex;flex-direction:column;gap:1px;">▲ 红外<em style="font-style:normal;font-size:8px;letter-spacing:1px;color:var(--grey)" class="mono">INFRARED 02</em></span><span style="flex:1;border:2px solid var(--ink);text-align:center;padding:8px 0;font-size:11.5px;font-weight:800;display:flex;flex-direction:column;gap:1px;background:var(--ink);color:var(--paper)">▲▲ 双模联挂<em style="font-style:normal;font-size:8px;letter-spacing:1px;color:#9a9a92" class="mono">DUAL-MODE</em></span></div>
<b style="font-size:13px;font-weight:900;letter-spacing:2px;display:block;margin-top:12px">单次执行时长</b><span style="font-size:9px;color:var(--grey)">定时结束 · 不连续运行</span>
<div style="display:flex;gap:8px;margin-top:6px"><span style="flex:1;border:2px solid var(--ink);text-align:center;font-size:11px;font-weight:800;padding:6px 0;">3 秒</span><span style="flex:1;border:2px solid var(--ink);text-align:center;font-size:11px;font-weight:800;padding:6px 0;background:var(--ink);color:var(--yellow)">5 秒</span><span style="flex:1;border:2px solid var(--ink);text-align:center;font-size:11px;font-weight:800;padding:6px 0;">8 秒</span></div>
<div style="background:var(--ink);color:var(--yellow);font-size:14px;font-weight:900;letter-spacing:4px;text-align:center;padding:12px 0;margin-top:12px">升起驱离信号<em style="font-style:normal;font-size:9px;letter-spacing:2px;color:#9a9a92;display:block">关联 Ac21d140f37 · 人工确认后执行</em></div>
</div></div>

<div class="dock"><span>信号台</span><span class="on">告警</span><span>升降</span><span>记录</span><span>我的</span></div>
</div></body></html>
