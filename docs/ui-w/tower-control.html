<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>A塔台 · 放行许可</title><style>
:root{--bg:#0c0f14;--card:#12161d;--line:#2a313c;--amber:#ffb400;--red:#ff4b3e;--txt:#e9e9e4;--dim:#7d8794;--sub:#5d6672}
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;font-family:"Arial Narrow","Noto Sans SC",sans-serif;color:var(--txt)}
.phone{width:390px;height:844px;margin:20px auto;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden;padding-top:44px}
.menubar{position:absolute;top:0;left:0;right:0;height:44px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;font-size:11px}
.menubar .ttl{color:var(--amber);font-weight:800;letter-spacing:2px}
.mono{font-family:Consolas,monospace}.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.hd b{font-size:18px;letter-spacing:2px}.hd span{font-size:9px;color:var(--sub);letter-spacing:2px}
.dock{position:absolute;bottom:0;left:0;right:0;height:48px;background:var(--card);border-top:1px solid var(--line);display:flex}
.dock span{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:3px;color:var(--dim)}
.dock .on{color:var(--amber);border-top:2px solid var(--amber)}
</style></head><body><div class="phone">
<div class="menubar"><span class="ttl">果园塔台</span><span class="mono">QINGHE TWR</span><span style="margin-left:auto" class="mono">9:41 LCL</span></div>

<div class="hd"><b>放行许可</b><span>CLEARANCE</span></div>
<div style="margin:0 14px;border:1px solid #8a6a1e;background:var(--card)">
<div style="display:flex;justify-content:space-between;padding:6px 10px;border-bottom:1px dashed var(--line);font-size:9px;letter-spacing:2px"><b style="color:var(--amber)">CLEARANCE · 放行许可</b><span style="color:var(--sub)">关联 BRD-0D86</span></div>
<div style="display:flex"><div style="flex:1;display:flex"><div style="flex:1;text-align:center;padding:9px 0;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--sub);border-right:1px solid var(--line)"><b style="font-size:11px">声波</b><small style="display:block;font-size:8px;letter-spacing:1px;color:#3d4756">ACOUSTIC</small></div><div style="flex:1;text-align:center;padding:9px 0;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--sub);border-right:1px solid var(--line)"><b style="font-size:11px">红外</b><small style="display:block;font-size:8px;letter-spacing:1px;color:#3d4756">INFRARED</small></div><div style="flex:1;text-align:center;padding:9px 0;font-size:11px;font-weight:700;letter-spacing:2px;color:#161307;background:var(--amber)"><b style="font-size:11px">双模联动</b><small style="display:block;font-size:8px;letter-spacing:1px;color:rgba(22,19,7,.65)">DUAL-MODE</small></div></div><div style="width:96px;text-align:center;background:var(--amber);color:#161307;font-weight:800;font-size:12px;letter-spacing:2px;display:flex;flex-direction:column;justify-content:center;gap:2px"><span>确认放行</span><span style="font-size:9px;letter-spacing:1px;opacity:.7">双模 · 5 秒</span></div></div>
</div>
<div style="margin:10px 14px;border:1px solid var(--line);background:var(--card);padding:10px"><b style="font-size:11px;letter-spacing:2px">单次执行时长</b><div style="display:flex;gap:6px;margin-top:8px"><span style="flex:1;text-align:center;padding:6px 0;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--txt)">3 秒</span><span style="flex:1;text-align:center;padding:6px 0;font-size:11px;font-weight:700;border:1px solid var(--amber);color:var(--amber)">5 秒</span><span style="flex:1;text-align:center;padding:6px 0;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--txt)">8 秒</span></div></div>
<div style="margin:10px 14px;border:1px solid var(--line);background:var(--card);padding:10px"><b style="font-size:11px;letter-spacing:2px">驱离反馈</b><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><i style="width:8px;height:8px;background:var(--amber);animation:bk 1.4s steps(2) infinite"></i><span style="font-size:11px;color:var(--txt)">驱离执行中 · 剩余 3.2 秒</span></div><div style="height:6px;background:#12161c;border:1px solid var(--line);margin-top:6px"><div style="width:36%;height:100%;background:var(--amber)"></div></div></div>

<div class="dock"><span>机坪</span><span>告警板</span><span class="on">放行</span><span>记录</span><span>我的</span></div>
</div></body></html>
