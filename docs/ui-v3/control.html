<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<title>远程控制 · 青禾果园守护</title></head>
<body>
<div class="phone">
  <div class="content">
    <div class="statusbar">
      <span class="time">9:41</span>
      <svg width="60" height="12" viewBox="0 0 66 12" fill="none">
        <rect y="6" width="3" height="6" rx="1" fill="#232b1d"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#232b1d"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#232b1d"/><rect x="15" width="3" height="12" rx="1" fill="#232b1d"/>
        <path d="M27 5.4a11 11 0 0115 0M29.6 8.2a7 7 0 019.8 0M32.2 10.6a3.2 3.2 0 014.4 0" stroke="#232b1d" stroke-width="1.6" stroke-linecap="round"/><circle cx="34.5" cy="11" r="1.2" fill="#232b1d"/>
        <rect x="49" y="1" width="14" height="10" rx="2.6" stroke="#232b1d" stroke-opacity=".4"/><rect x="50.6" y="2.6" width="8.6" height="6.8" rx="1.4" fill="#232b1d"/>
      </svg>
    </div>
    <div class="navhead">
      <div class="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#43503e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="navtitle">远程控制</span>
      <div class="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" stroke="#8a917f" stroke-width="1.5"/><path d="M12 11v5" stroke="#8a917f" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="8" r="1" fill="#8a917f"/></svg></div>
    </div>

    <!-- 驱离方式（我们既有的三选一） -->
    <div class="chiprow" style="padding-bottom:0">
      <div class="chip on">双模联动</div>
      <div class="chip">声波</div>
      <div class="chip">红外</div>
    </div>

    <!-- 设备卡（图1：设备插画 + 圆环 + 在线） -->
    <div class="devcard">
      <div class="orbit">
        <span class="ring"></span>
        <div class="cam">
          <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="14" width="24" height="16" rx="4" fill="#54503f"/>
            <rect x="30" y="18" width="9" height="8" rx="2" fill="#3a4530"/>
            <circle cx="20" cy="22" r="5" fill="#2b3324"/>
            <circle cx="20" cy="22" r="2.2" fill="#9ec247"/>
            <rect x="19" y="30" width="2.6" height="8" fill="#3a4530"/>
            <rect x="12" y="38" width="17" height="3" rx="1.5" fill="#54503f"/>
          </svg>
        </div>
        <span style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--success-fg);background:#fff;padding:2px 8px;white-space:nowrap;border-radius:99px;box-shadow:0 1px 3px rgba(36,43,28,.15)">
          <i style="width:5px;height:5px;border-radius:50%;background:var(--success-fg)"></i>设备在线
        </span>
      </div>
      <div class="devname">双模驱离系统</div>
      <span class="qh-devcode" style="font-family:var(--font-num);font-size:10px;color:var(--ink-400);letter-spacing:1px">东区果园 · DUAL-MODE · ACOUSTIC 01 + INFRARED 02</span>
    </div>

    <!-- 开关列表（图1：声波/红外/定时） -->
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="togglerow">
        <div style="flex:1"><div class="t">声波驱鸟</div><div class="sub">声学驱鸟器 01 · 定时 3-8 秒</div></div>
        <div class="tgl"><i></i></div>
      </div>
      <div class="togglerow">
        <div style="flex:1"><div class="t">红外驱鸟</div><div class="sub">红外驱鸟器 02 · 脉冲束流</div></div>
        <div class="tgl"><i></i></div>
      </div>
      <div class="togglerow" style="align-items:center">
        <div style="flex:1"><div class="t">定时模式</div><div class="sub">每日 06:00 - 19:00 自动巡护</div></div>
        <span class="trendsel">已开启 <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#6d7f6c" stroke-width="2" stroke-linecap="round"/></svg></span>
      </div>
    </div>

    <!-- 执行时长（我们既有） -->
    <div class="card" style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:600;color:var(--ink-700)">单次执行时长</span><span style="font-size:10px;color:var(--ink-400)">定时结束 · 不连续运行</span></div>
      <div style="display:flex;gap:8px">
        <div class="qh-duropt" style="flex:1;height:40px;border-radius:var(--r-md);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink-700)">3 秒</div>
        <div class="qh-duropt" style="flex:1;height:40px;border-radius:var(--r-md);background:var(--brand-700);color:#f5f7ec;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">5 秒</div>
        <div class="qh-duropt" style="flex:1;height:40px;border-radius:var(--r-md);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink-700)">8 秒</div>
      </div>
    </div>

    <div class="gobtn">
      <div class="logbtn" style="letter-spacing:2px;border-radius:var(--r-lg)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="margin-right:8px"><path d="M12 3l7 2.6v5.2c0 4.6-3 8.4-7 10.2-4-1.8-7-5.6-7-10.2V5.6L12 3z" stroke="#f5f7ec" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11.6l2.2 2.2 4-4.2" stroke="#d3e856" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        立即启动驱离
      </div>
    </div>
    <div class="qh-note" style="text-align:center;font-size:10px;color:var(--ink-300);margin-top:9px">模拟执行器 · 不会控制真实硬件</div>
    <div style="height:18px"></div>
  </div>
</div>
</body></html>
