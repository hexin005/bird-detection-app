<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<title>登录 · 青禾果园守护</title></head>
<body>
<div class="phone">
  <div class="login">
    <div class="hero">
      <svg class="bg" viewBox="0 0 390 390" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcead8"/><stop offset=".55" stop-color="#eef0df"/><stop offset="1" stop-color="#f3f1e7"/>
          </linearGradient>
          <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b9c9a8"/><stop offset="1" stop-color="#d8e0c4"/>
          </linearGradient>
          <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#93ac83"/><stop offset="1" stop-color="#bcc9a6"/>
          </linearGradient>
        </defs>
        <rect width="390" height="390" fill="url(#sky)"/>
        <circle cx="318" cy="64" r="30" fill="#fff" opacity=".55"/>
        <path d="M-10 300 Q60 218 130 296 T300 288 Q350 258 400 292 L400 400 L-10 400 Z" fill="url(#m1)" opacity=".8"/>
        <path d="M-10 340 Q80 268 170 336 T400 330 L400 400 L-10 400 Z" fill="url(#m2)"/>
        <path d="M-10 372 Q120 320 230 368 T400 362 L400 400 L-10 400 Z" fill="#7f9a6b"/>
        <!-- 果树行列 -->
        <g fill="#6d8a58">
          <circle cx="52" cy="352" r="13"/><circle cx="96" cy="356" r="11"/><circle cx="140" cy="360" r="12"/>
          <circle cx="252" cy="360" r="12"/><circle cx="296" cy="356" r="11"/><circle cx="340" cy="352" r="13"/>
        </g>
        <!-- 花枝与小鸟 -->
        <g stroke="#7c9a68" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M20 130 Q90 96 150 108 T258 92"/>
          <path d="M92 106 Q104 128 96 148" stroke-width="2.4"/>
        </g>
        <g fill="#f6f1e4">
          <circle cx="150" cy="108" r="5"/><circle cx="196" cy="98" r="4.4"/><circle cx="238" cy="94" r="5"/>
          <circle cx="118" cy="118" r="4.2"/><circle cx="60" cy="122" r="4.6"/>
        </g>
        <g fill="#e9b7c0">
          <circle cx="150" cy="108" r="2"/><circle cx="196" cy="98" r="1.8"/><circle cx="238" cy="94" r="2"/>
        </g>
        <!-- 小鸟剪影 -->
        <g transform="translate(300 76)">
          <ellipse cx="0" cy="0" rx="17" ry="11" fill="#5d734c"/>
          <circle cx="14" cy="-8" r="7.4" fill="#5d734c"/>
          <path d="M20 -9 L30 -6.6 L20 -4.6 Z" fill="#e0a03a"/>
          <circle cx="16" cy="-9.6" r="1.4" fill="#232b1d"/>
          <path d="M-6 -3 Q-18 -14 -30 -10 Q-16 -2 -6 2 Z" fill="#4c6140"/>
          <path d="M2 9 L6 17 M6 9 L11 16" stroke="#4c6140" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="herotext">
        <div class="mark">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 21c-4.5-1.6-7-5.2-7-9.4C5 7 8.4 3.6 12.6 3.2c.3 4.6-.7 13-9.6 13.4" stroke="#f5f7ec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21c3.8-1.4 6-4.4 6-8" stroke="#d3e856" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h1>青禾 · 果园守护</h1>
        <p>智 慧 果 园 · 科 技 护 航</p>
      </div>
    </div>

    <div class="formcard">
      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="#8a917f" stroke-width="1.5"/><path d="M4.8 19.4a7.6 7.6 0 0114.4 0" stroke="#8a917f" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>请输入账号</span>
      </div>
      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10" width="15" height="9.5" rx="2.5" stroke="#8a917f" stroke-width="1.5"/><path d="M8 10V7.6a4 4 0 018 0V10" stroke="#8a917f" stroke-width="1.5"/></svg>
        <span>请输入密码</span>
        <svg class="eye" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z" stroke="#a3ab97" stroke-width="1.4"/><circle cx="12" cy="12" r="2.6" stroke="#a3ab97" stroke-width="1.4"/></svg>
      </div>
      <div class="logbtn">登录</div>
    </div>

    <div class="connrow"><i></i><span>设备连接中…</span></div>

    <svg class="leafcorner" style="left:-8px;bottom:-6px" width="130" height="120" viewBox="0 0 130 120" fill="none">
      <path d="M10 118 Q18 70 2 44 Q40 58 44 108 Z" fill="#c9d4ae"/>
      <path d="M56 120 Q60 84 44 66 Q74 74 76 116 Z" fill="#b7c79a"/>
      <circle cx="96" cy="104" r="4" fill="#dfe6c8"/><circle cx="110" cy="92" r="3.4" fill="#dfe6c8"/><circle cx="102" cy="80" r="3" fill="#dfe6c8"/>
    </svg>
    <div style="height:26px"></div>
  </div>
</div>
</body></html>
